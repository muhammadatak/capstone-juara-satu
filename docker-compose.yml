services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: phising_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d phising_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      DATABASE_URL: postgresql+asyncpg://admin:${DB_PASSWORD:-123}@postgres:5432/phising_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      # email (mailtrap)
      MAIL_SERVER: ${MAIL_SERVER:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@example.com}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
    volumes:
      - screenshots:/app/screenshots
      # model bisa di-mount dari luar, atau pakai bawaan image
      - ./backend/services/model:/app/services/model
    restart: unless-stopped

  nginx:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  screenshots:
